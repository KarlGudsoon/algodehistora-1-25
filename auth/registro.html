<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Crear cuenta</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <form
      id="registerForm"
      class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm"
    >
      <h1 class="text-2xl font-bold mb-6">Crear cuenta</h1>

      <div
        id="errorMessage"
        class="hidden bg-red-100 text-red-700 p-3 rounded mb-4"
      ></div>

      <label class="block mb-2 text-sm font-medium">Nombre</label>
      <input
        type="text"
        id="name"
        class="w-full border rounded p-2 mb-4"
        required
      />

      <label class="block mb-2 text-sm font-medium">Correo electrónico</label>
      <input
        type="email"
        id="email"
        class="w-full border rounded p-2 mb-4"
        required
      />

      <label class="block mb-2 text-sm font-medium">Contraseña</label>
      <input
        type="password"
        id="password"
        class="w-full border rounded p-2 mb-6"
        required
        minlength="8"
      />

      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
      >
        Registrarse
      </button>

      <p class="text-sm text-center mt-4">
        ¿Ya tienes cuenta?
        <a href="/login.html" class="text-blue-600">Inicia sesión</a>
      </p>
    </form>

    <script src="/js/services/authService.js"></script>
    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const errorBox = document.getElementById("errorMessage");

          errorBox.classList.add("hidden");

          try {
            const result = await register(email, password, name);
            window.location.href = "/";
          } catch (error) {
            console.error("Error during registration:", error);
            errorBox.textContent = error.message;
            errorBox.classList.remove("hidden");
          }
        });
    </script>
  </body>
</html>
