<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | Historia Interactiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/icons/logo.svg" />
  </head>
  <body class="bg-gray-100 min-h-screen flex flex-col">
    <header id="header"></header>
    <div id="navbarmobile"></div>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
      <form
        id="loginForm"
        class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm"
      >
        <h1 class="text-2xl font-bold mb-1 text-gray-800">Iniciar sesión</h1>
        <p class="text-sm text-gray-500 mb-6">
          Continúa tu recorrido por la historia
        </p>

        <div
          id="errorMessage"
          class="hidden bg-red-100 text-red-700 text-sm p-3 rounded mb-4"
        ></div>

        <label for="email" class="block mb-1 text-sm font-medium text-gray-700"
          >Correo electrónico</label
        >
        <input
          type="email"
          id="email"
          name="email"
          class="w-full border border-gray-300 rounded p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
          autocomplete="email"
        />

        <label
          for="password"
          class="block mb-1 text-sm font-medium text-gray-700"
          >Contraseña</label
        >
        <input
          type="password"
          id="password"
          name="password"
          class="w-full border border-gray-300 rounded p-2 mb-6 focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
          minlength="8"
          autocomplete="current-password"
        />

        <button
          type="submit"
          id="loginBtn"
          class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Ingresar
        </button>

        <p class="text-sm text-center mt-4 text-gray-600">
          ¿No tienes cuenta?
          <a href="/auth/registro.html" class="text-blue-600 hover:underline"
            >Regístrate</a
          >
        </p>
      </form>
    </main>

    <footer id="footer"></footer>

    <script src="/js/services/authService.js"></script>
    <script src="/js/ui/nav.js"></script>
    <script src="/js/layout.js"></script>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const errorBox = document.getElementById("errorMessage");
          const btn = document.getElementById("loginBtn");

          errorBox.classList.add("hidden");
          btn.disabled = true;
          btn.textContent = "Ingresando...";

          try {
            await login(email, password);
            window.location.href = "/";
          } catch (error) {
            errorBox.textContent = error.message;
            errorBox.classList.remove("hidden");
            btn.disabled = false;
            btn.textContent = "Ingresar";
          }
        });
    </script>
  </body>
</html>
